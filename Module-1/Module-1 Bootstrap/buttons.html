<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buttons</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <section class="container py-5">
      <h2 class="section-title">Button Styles</h2>

      <div class="card p-4">
        <button class="btn btn-primary">Primary</button>

        <button class="btn btn-secondary">Secondary</button>

        <button class="btn btn-success">Success</button>

        <button class="btn btn-danger">Danger</button>

        <button class="btn btn-warning">Warning</button>

        <button class="btn btn-info">Info</button>

        <button class="btn btn-outline-primary">Outline</button>
      </div>
    </section>

    <section class="container py-5">
      <h2 class="section-title">Button Groups</h2>

      <div class="btn-group">
        <button class="btn btn-dark">Left</button>

        <button class="btn btn-dark">Middle</button>

        <button class="btn btn-dark">Right</button>
      </div>

      <hr />

      <input type="checkbox" class="btn-check" id="toggle1" />

      <label class="btn btn-success" for="toggle1"> Toggle Button </label>
    </section>

    <footer>Exercise 9 Completed</footer>
  </body>
</html>
