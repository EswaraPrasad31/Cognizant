<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cards & Media Objects</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="#"> Bootstrap Portal </a>
      </div>
    </nav>

    <!-- Profile Card -->

    <section class="container py-5">
      <h2 class="section-title">Profile Card</h2>

      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card demo-card">
            <img src="https://picsum.photos/400/250" class="card-img-top" />

            <div class="card-body">
              <h4 class="card-title">John Doe</h4>

              <p>Frontend Developer</p>

              <button class="btn btn-info">View Profile</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Media Object -->

    <section class="container py-5">
      <h2 class="section-title">Media Object</h2>

      <div class="card p-4">
        <div class="d-flex align-items-center">
          <img src="https://picsum.photos/120" class="rounded-circle me-4" />

          <div>
            <h4>Bootstrap Learning Portal</h4>

            <p>
              Bootstrap provides responsive layouts, components and utilities
              for modern web development.
            </p>
          </div>
        </div>
      </div>
    </section>

    <footer>Exercise 11 Completed</footer>
  </body>
</html>
