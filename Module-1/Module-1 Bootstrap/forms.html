<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forms</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html"> Bootstrap Portal </a>
      </div>
    </nav>

    <section class="container py-5">
      <h2 class="section-title">Registration Form</h2>

      <form class="card p-4">
        <div class="input-group mb-3">
          <span class="input-group-text"> @ </span>

          <input type="text" class="form-control" placeholder="Username" />
        </div>

        <input type="email" class="form-control mb-3" placeholder="Email" />

        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" />

          <label class="form-check-label"> Accept Terms </label>
        </div>

        <button class="btn btn-info">Register</button>
      </form>
    </section>

    <section class="container py-5">
      <h2 class="section-title">Login Form Floating</h2>

      <div class="card p-4">
        <div class="form-floating mb-3">
          <input type="email" class="form-control" placeholder="Email" />

          <label>Email Address</label>
        </div>

        <div class="form-floating">
          <input type="password" class="form-control" placeholder="Password" />

          <label>Password</label>
        </div>
      </div>
    </section>

    <footer>Exercise 8 Completed</footer>
  </body>
</html>
