<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Registration</title>
</head>
<body>
    <header>
        <h1>Resident Registration</h1>
    </header>
    <main>
        <form>
            <label>Full Name:</label><br>
            <input type="text" name="fullname" required><br><br>

            <label>Flat / House Number:</label><br>
            <input type="text" name="house" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>

            <label>Mobile Number:</label><br>
            <input type="tel" name="mobile" required><br><br>

            <label>Password:</label><br>
            <input type="password" name="password" required><br><br>

            <label>Confirm Password:</label><br>
            <input type="password" name="confirmpassword" required><br><br>

            <label>Resident Type:</label><br>

            <input type="radio" name="residentType" value="Owner">
            <label>Owner</label>

            <input type="radio" name="residentType" value="Tenant">
            <label>Tenant</label><br><br>

            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
