<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Registration</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="register-container">

        <form class="register-form">

            <h2>Resident Registration</h2>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="house">Flat / House Number</label>
            <input type="text" id="house" name="house" placeholder="Enter flat number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create password" required>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>

            <label>Resident Type</label>

            <div class="radio-group">
                <input type="radio" id="owner" name="residentType" value="Owner">
                <label for="owner">Owner</label>

                <input type="radio" id="tenant" name="residentType" value="Tenant">
                <label for="tenant">Tenant</label>
            </div>

            <button type="submit">Register</button>

        </form>

    </main>

</body>
</html>
