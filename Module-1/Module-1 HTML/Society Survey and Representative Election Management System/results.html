<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results</title>
</head>
<body>

    <header>
        <h1>Poll Results</h1>
    </header>

    <main>

        <h2>President Election Results</h2>

        <table border="1" cellpadding="10">
            <tr>
                <th>Candidate Name</th>
                <th>Votes Received</th>
                <th>Vote Percentage</th>
            </tr>

            <tr>
                <td>Rahul Sharma</td>
                <td>120</td>
                <td>48%</td>
            </tr>

            <tr>
                <td>Priya Verma</td>
                <td>90</td>
                <td>36%</td>
            </tr>

            <tr>
                <td>Amit Kumar</td>
                <td>40</td>
                <td>16%</td>
            </tr>
        </table>

        <br>

        <h2>🏆 Winner: Rahul Sharma</h2>

        <h3>Vote Distribution</h3>

        <p>Rahul Sharma - 48%</p>
        <progress value="48" max="100"></progress>

        <p>Priya Verma - 36%</p>
        <progress value="36" max="100"></progress>

        <p>Amit Kumar - 16%</p>
        <progress value="16" max="100"></progress>

    </main>

</body>
</html>
