<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Survey</title>
</head>
<body>
    <header>
        <h1>Society Feedback Survey</h1>
    </header>

    <main>
        <form>
            <h3>1. Cleanliness Satisfaction</h3>
            <input type="radio" name="cleanliness" value="Excellent">Excellent<br>
            <input type="radio" name="cleanliness" value="Good">Good<br>
            <input type="radio" name="cleanliness" value="Average">Average<br>
            <input type="radio" name="cleanliness" value="Poor">Poor<br><br>

            <h3>2. Security Service Feedback</h3>
            <input type="checkbox">Security Staff Friendly<br>
            <input type="checkbox">Security Staff Alert<br>
            <input type="checkbox"> Need Improvement in Security<br><br>

            <h3>3. Parking Issues</h3>
            <select>
                <option>Select Option</option>
                <option>No issues</option>
                <option>Limited Parking</option>
                <option>Unavailable Parking</option>
            </select>
            <br><br>

            <h3>4. Water Supply Feedback</h3>
            <textarea rows="4" cols="40"></textarea>

            <br><br>

            <h3>5. Maintenance quality</h3>
            <textarea rows="4" cols="40"></textarea>

            <h3>6. Suggestions</h3>
            <textarea rows="5" cols="50"></textarea>

            <br><br>
            <button type="submit">Submit Survey</button>
        </form>
    </main>
</body>
</html>
